name: Container
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
concurrency:
  group: pia-container-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'prod' || 'dev' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # Gate de release das páginas legais (test/legal_release.test.js, docs/legal.md).
          # Ligado só em push para main e em tags v*: bloqueia publicar a imagem com texto em rascunho.
          PIA_LEGAL_RELEASE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && '1' || '' }}
      - uses: docker/setup-qemu-action@v3
      - name: Connect to private registry VPN
        if: github.event_name != 'pull_request'
        env:
          WG_CONFIG: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.WG_CONFIG_PROD || secrets.WG_CONFIG_DEV }}
        run: |
          set -euo pipefail
          test -n "$WG_CONFIG"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wireguard-tools
          sudo install -d -m 700 /etc/wireguard
          printf '%s\n' "$WG_CONFIG" | sed '/^[[:space:]]*DNS[[:space:]]*=/d' | sudo tee /etc/wireguard/wg-ci.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg-ci.conf
          sudo wg-quick up wg-ci
          echo '10.13.13.1 registry.vpn.travelrpg.com' | sudo tee -a /etc/hosts > /dev/null
          status=$(curl --noproxy '*' --connect-timeout 10 --max-time 20 -sS -o /dev/null -w '%{http_code}' https://registry.vpn.travelrpg.com/v2/)
          test "$status" = 401
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request'
      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [dns]
              nameservers = ["10.13.13.1"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: registry.vpn.travelrpg.com
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: registry.vpn.travelrpg.com/pia/pia-server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Disconnect registry VPN
        if: always() && github.event_name != 'pull_request'
        run: |
          sudo wg-quick down wg-ci 2>/dev/null || true
          sudo rm -f /etc/wireguard/wg-ci.conf
