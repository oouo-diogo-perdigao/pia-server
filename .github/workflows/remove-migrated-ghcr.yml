name: Remove migrated PIA GHCR package
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  remove-legacy-pia:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the migrated PIA package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="/users/oouo-diogo-perdigao/packages/container/pia-server"
          package=$(gh api "$endpoint")
          test "$(printf '%s' "$package" | jq -r '.name')" = pia-server
          printf '%s' "$package" | jq '{name,visibility,repository:.repository.full_name}'
          gh api --paginate "$endpoint/versions?per_page=100" --jq 'length'
          gh api --method DELETE "$endpoint"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com$endpoint")
          test "$status" = 404
          echo "Migrated PIA package removed from GHCR; API confirmed 404."
